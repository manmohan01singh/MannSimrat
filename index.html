<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mann Simrat — Thanda Theevan Jeeo</title>
  <meta name="description" content="Mann Simrat Thanda Theevan Jeeo — ਮਨ ਸਿਮਰਤ ਠੰਢਾ ਥੀਵੈ ਜੀਉ by Padma Shri Arijit Singh. One track, on loop, for your TV.">
  <meta property="og:title" content="Mann Simrat — Thanda Theevan Jeeo">
  <meta property="og:description" content="Padma Shri Arijit Singh • Sabad Naad • One track, on loop">
  <meta property="og:image" content="https://i.ytimg.com/vi/KQ-wcUDV2a8/maxresdefault.jpg">
  <meta property="og:type" content="music.song">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@500;600;700&family=Noto+Serif+Gurmukhi:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
</head>
<body>
  <!-- Living background: slow gradient + drifting orbs -->
  <div class="bg" aria-hidden="true"></div>
  <div class="orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <span class="orb orb-5"></span>
  </div>

  <main class="stage">
    <button id="loopBtn" class="loop-pill is-on" type="button" aria-pressed="true">⟳&nbsp; Loop: On</button>

    <figure class="album-card">
      <img id="albumArt"
           src="https://i.ytimg.com/vi/KQ-wcUDV2a8/maxresdefault.jpg"
           onerror="this.onerror=null; this.src='https://i.ytimg.com/vi/KQ-wcUDV2a8/hqdefault.jpg';"
           alt="Mann Simrat Thanda Theevan Jeeo — official Sabad Naad thumbnail"
           width="1280" height="720" fetchpriority="high">
    </figure>

    <h1 class="title-gu" lang="pa">ਮਨ ਸਿਮਰਤ ਠੰਢਾ ਥੀਵੈ ਜੀਉ</h1>
    <p class="title-en">Mann Simrat · Arijit Singh</p>

    <div class="progress-wrap" id="progressWrap" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <button id="playBtn" class="play-btn" type="button" aria-label="Play">▶</button>

    <!-- Official YouTube player: audio only, kept in layout (not display:none)
         so the IFrame API works. The album art above is the visual. -->
    <div id="player" aria-hidden="true"></div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
